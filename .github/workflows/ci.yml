name: CI

on:
  push:
    branches: [production, development]
  pull_request:
    branches: [production, development]

# AppKit étant macOS-only (Cocoa, Objective-C `.m`),
# la CI tourne sur macos-latest.
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Crystal
        run: brew install crystal
      - name: Install dependencies
        run: shards install
      - name: Format check
        run: crystal tool format --check src/ spec/
      - name: Lint (ameba)
        run: bin/ameba
      - name: Specs
        run: crystal spec
